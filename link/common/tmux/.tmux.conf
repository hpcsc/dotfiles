# ======================= Settings ===================================
set -g mouse on # enable mouse mode - tmux 2.1 and above

# Don't add any delay for pressing the escape key.
# Without this, vim becomes *really* annoying to use.
# The default is 500ms. Reduce it substantially.
# Copy from https://github.com/BurntSushi/dotfiles/blob/master/.tmux.conf
set -g escape-time 20

# Start window numbering at 1.
set -g base-index 1

# Automatically renumber windows when one is killed.
set -g renumber-windows on

set -g status-position top

set -g display-panes-time 4000

set -g history-limit 10000

# Automatically rename window to current directory
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

set-option -w -g mode-keys vi # Use vi key bindings in copy mode

# Image previews in yazi and snacks.nvim break without all three: passthrough carries
# the graphics escapes tmux would swallow, and update-environment stops tmux masking
# the real terminal behind TERM_PROGRAM=tmux, which demotes yazi to its chafa fallback.
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ======================= Key Bindings ===================================
# Every binding carries a -N note: Prefix + ? shows a binding by its note and falls back
# to the raw command without one. A binding that opens a tool — a popup, a menu or a
# pane of its own — starts its note with "[tool] ". Prefix + ? replaces tmux's own
# (list-keys -N) with a filterable popup that opens on the tools. ctrl-a moves on to the
# bindings this file and the plugins add or change, then to every binding, then back to
# the tools. Enter runs the chosen one in the pane the popup sits over.
bind-key -N "Browse, filter and run key bindings (tools first)" ? display-popup -E -w 80% -h 75% -T ' keys ' "$HOME/.local/bin/tmux-custom-keys --fzf --tools"

bind-key -N "Begin selection" -T copy-mode-vi 'v' send -X begin-selection
bind-key -N "Copy the selection" -T copy-mode-vi 'y' send -X copy-selection

bind -N "Reload ~/.tmux.conf" r source-file ~/.tmux.conf
unbind '"'
unbind %
bind -N "Split window left/right in the pane's directory" % split-window -h -c "#{pane_current_path}"
bind -N "Split window top/bottom in the pane's directory" '"' split-window -v -c "#{pane_current_path}"
bind -N "Open a 30%-high pane below, in the pane's directory" v split-window -v -c  "#{pane_current_path}" -p 30
bind -N "Open a 30%-high pane below, in the pane's directory" - split-window -v -l 30% -c "#{pane_current_path}"

unbind c
bind -N "New window in the pane's directory" c new-window -c "#{pane_current_path}"

bind -N "Clear the screen and the scrollback" C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

bind-key -N "Select the pane to the left of the active pane" -r h select-pane -L
bind-key -N "Select the pane below the active pane" -r j select-pane -D
bind-key -N "Select the pane above the active pane" -r k select-pane -U
bind-key -N "Select the pane to the right of the active pane" -r l select-pane -R

bind -N "Select the pane to the left of the active pane" -n M-h select-pane -L
bind -N "Select the pane below the active pane" -n M-j select-pane -D
bind -N "Select the pane above the active pane" -n M-k select-pane -U
bind -N "Select the pane to the right of the active pane" -n M-l select-pane -R

bind -N "Select the previous window" -n M-[ previous-window
bind -N "Select the next window" -n M-] next-window

# Use Alt-Shift-[] keys without prefix key to switch sessions (mirrors Alt-[]
# for windows). Shift makes them { and }, which sidestep the Ctrl-[ / Escape
# clash. The keys are quoted because tmux treats a bare } as a command-block end.
bind -N "Switch to the previous session" -n 'M-{' switch-client -p
bind -N "Switch to the next session" -n 'M-}' switch-client -n

pane_resize="5"
bind-key -N "Resize the pane left by $pane_resize" -r H resize-pane -L "$pane_resize"
bind-key -N "Resize the pane down by $pane_resize" -r J resize-pane -D "$pane_resize"
bind-key -N "Resize the pane up by $pane_resize" -r K resize-pane -U "$pane_resize"
bind-key -N "Resize the pane right by $pane_resize" -r L resize-pane -R "$pane_resize"

# Move windows
# bind-key -n C-H swap-window -t -1
# bind-key -n C-L swap-window -t +1

bind-key -N "[tool] Pick a window with fzf (ftw)" -r f send-keys 'ftw' Enter
bind-key -N "Toggle synchronize-panes" e set -g synchronize-panes
bind-key -N "Kill every pane but the active one" a kill-pane -a

# Nothing is executed — the branch lands in whatever you were already typing. Detached
# HEAD gives the short SHA, and outside a repo it types nothing rather than an error.
bind-key -N "Type this pane's git branch at the cursor" b run-shell -b "b=\$(git -C '#{pane_current_path}' symbolic-ref --quiet --short HEAD 2>/dev/null || git -C '#{pane_current_path}' rev-parse --short HEAD 2>/dev/null); [ -n \"\$b\" ] && tmux send-keys -t '#{pane_id}' -l \"\$b\""

bind-key -N "[tool] Open a scratch tmux session in a popup" -r u display-popup -E -d "#{pane_current_path}" "tmux new -s popup"

bind-key -N "[tool] Workmux session list: jump to, create or delete across all repos" S run-shell "/usr/local/bin/tmux-workmux-menu.sh '#{client_name}'"

bind-key -N "[tool] Show or hide the workmux agent dashboard in a floating pane" D run-shell "$HOME/.local/bin/tmux-workmux-dashboard '#{pane_id}'"

# Each entry opens in a floating pane at the top of the window, and q closes it. Add an
# entry as one line: "<label>" <key> "<tmux command>".
# Keep the shell work in a script under ~/.local/bin so the entry stays one level of
# quoting deep. A row whose entries change with the work (tasks, stories) opens a
# submenu built by claude-read-menu instead of listing them here — see that script for why.
bind-key -N "[tool] Menu of things to read, each in a floating pane" R display-menu -T ' read ' -x C -y C \
  "newest merge-risk memo" m "new-pane -x 90% -y 70% -X 5% -Y 1 '$HOME/.local/bin/claude-merge-risk-memo \"#{pane_current_path}\"'" \
  "" "" "" \
  "tasks"        t "run-shell '$HOME/.local/bin/claude-read-menu tasks \"#{pane_current_path}\" \"#{client_name}\"'" \
  "user stories" s "run-shell '$HOME/.local/bin/claude-read-menu stories \"#{pane_current_path}\" \"#{client_name}\"'"

bind-key -N "[tool] Fork this pane's Claude conversation into a new pane or window" F display-menu -T ' fork claude ' -x C -y C \
  "split right" r "run-shell '$HOME/.local/bin/claude-fork right \"#{pane_id}\" \"#{client_name}\"'" \
  "split below" b "run-shell '$HOME/.local/bin/claude-fork below \"#{pane_id}\" \"#{client_name}\"'" \
  "new window"  w "run-shell '$HOME/.local/bin/claude-fork window \"#{pane_id}\" \"#{client_name}\"'" \
  "floating pane" f "run-shell '$HOME/.local/bin/claude-fork floating \"#{pane_id}\" \"#{client_name}\"'"

# ======================= Hooks ===================================
# window_panes also counts floating panes, so this writes one x for each tiled pane.
set-hook -g window-layout-changed 'if -F "#{!=:#{P:#{?pane_floating_flag,,x}},x}" "set-option -w pane-border-status bottom" "set-option -w pane-border-status off"'

# ======================= Plugins ===================================
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins 'git'
set -g @dracula-git-disable-status true
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session

# Binds prefix + W: the tree of every session, window and pane, to rearrange them.
set -g @plugin 'hpcsc/tmux-arrange'
# set -g @plugin 'tmux-plugins/tmux-sessionist'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'

# tpm and tmux-arrange bind these keys, so these lines must come after tpm. With no
# command, bind-key replaces only the note.
bind -N "Install the plugins that @plugin lists (tpm)" I
bind -N "Update the installed plugins (tpm)" U
bind -N "Remove the plugins that @plugin no longer lists (tpm)" M-u
bind -N "[tool] Arrange windows and panes across sessions in a popup" W
